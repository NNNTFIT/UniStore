<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UniStore Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../signup/style-signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <a class="btn-back" href="../login/login.html"><img class="back-1" src="../../img/login/arrow-left-line (1).svg" alt=""><img
            class="back-2" src="../../img/login/arrow-left-line.svg" alt=""></a>
    <div class="container">
        <div class="left">
            <div class="logo">
                <img src="../../img/login/logo.svg" alt="">
            </div>
            <div class="welcome-text">
                <h1>
                    Đưa ứng dụng đến với mọi người<br>
                    Tham gia UniStore để tải lên<br>
                    và chia sẻ ứng dụng của bạn<br>
                    với cộng đồng.<br>
                </h1>
            </div>
        </div>
        <div class="right">
            <div class="form-box">
                <h2>Tạo tài khoản</h2>
                <div class="input-group">
                    <label>Tên</label>
                    <input type="email" id="signup-name" placeholder="poppie@gmail.com">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="poppie@gmail.com">
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <div class="password-box">
                        <input type="password" id="signup-password" placeholder="Nhập mật khẩu">
                        <img src="../../img/login/eye-close-line (1).svg" class="eye-close" alt="">
                        <img src="../../img/login/eye-line (1).svg" class="eye-open" alt="">
                    </div>
                </div>
                <div class="input-group">
                    <label>Nhập Lại Mật khẩu</label>
                    <div class="password-box">
                        <input type="password" id="signup-repassword" placeholder="Nhập mật khẩu">
                        <img src="../../img/login/eye-close-line (1).svg" class="eye-close" alt="">
                        <img src="../../img/login/eye-line (1).svg" class="eye-open" alt="">
                    </div>
                </div>
                <button class="btn-primary" onclick="handleRegister()">Tạo tài khoản</button>
                <p class="login-text">
                    Đã có tài khoản? 
                    <a href="../login/login.html">Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
    <script src="../signup/signup.js"></script>
    <script src="../../share/js/auth.js"></script>
</body>
<script>
    const passwordBoxes = document.querySelectorAll('.password-box');
    passwordBoxes.forEach(box => {
        const input = box.querySelector('input');
        const eyeClose = box.querySelector('.eye-close');
        const eyeOpen = box.querySelector('.eye-open');

        eyeClose.addEventListener('click', () => {
            input.type = 'text';
            eyeClose.style.display = 'none';
            eyeOpen.style.display = 'block';
        });

        eyeOpen.addEventListener('click', () => {
            input.type = 'password';
            eyeOpen.style.display = 'none';
            eyeClose.style.display = 'block';
        });
    });
</script>
</html>
