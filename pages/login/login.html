<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UniStore Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../login/style-login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <a class="btn-back" href="../home/index.html"><img src="../../img/login/arrow-left-line (1).svg" alt=""></a>
    <div class="block--1"></div>
    <div class="block--2"></div>
    <div class="logo">
        <img src="../../img/login/logo.svg" alt="">
    </div>
    <div class="login-card">
        <h2>Đăng nhập tài khoản</h2>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="poppie@gmail.com">
        </div>

        <div class="form-group">
            <div class="password-row">
                <label>Mật khẩu</label>
                <a href="#" class="forgot">Quên mật khẩu ?</a>
            </div>
            <div class="password-input">
                <input type="password" id="login-password" placeholder="Nhập mật khẩu">
                <img src="../../img/login/eye-close-line (1).svg" class="eye-close" alt="">
                <img src="../../img/login/eye-line (1).svg" class="eye-open" alt="">
            </div>
        </div>
        <button class="login-btn" onclick="handleLogin()">Đăng nhập ngay</button>
        <div class="signup">
            Chưa có tài khoản ? <a href="../signup/signup.html">Đăng ký</a>
        </div>
    </div>
    <script src="../../share/js/auth.js"></script>
    <script src="../login/login.js"></script>
</body>
<script>
    const passwordInput = document.querySelector('.password-input input');
    const eyeClose = document.querySelector('.eye-close');
    const eyeOpen = document.querySelector('.eye-open');

    eyeClose.addEventListener('click', function () {
        passwordInput.type = 'text';
        eyeClose.style.display = 'none';
        eyeOpen.style.display = 'block';
    });

    eyeOpen.addEventListener('click', function () {
        passwordInput.type = 'password';
        eyeOpen.style.display = 'none';
        eyeClose.style.display = 'block';
    });
</script>

</html>
