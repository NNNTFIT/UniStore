<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../share/css/header.css">
    <link rel="stylesheet" href="style-upload.css">
    <link rel="stylesheet" href="../../share/css/style-footer.css">
    <title>Upload</title>
</head>

<body>
    <header></header>
    <div class="upload-container">
        <div class="header-section">
            <h1>Tải dự án lên</h1>
            <p>Chia sẻ thành quả của bạn với cộng đồng sinh viên IUH</p>
        </div>
        <div class="upload-card">
            <form id="uploadForm">
                <div class="form-group">
                    <label class="form-label">Logo ứng dụng</label>
                    <div class="logo-upload-wrapper">
                        <input type="file" id="logoInput" accept="image/*" hidden>
                        <div class="logo-preview-box" onclick="">
                            <span class="plus-icon" id="plusIcon">+</span>
                            <img id="logoPreview" src="" alt="Preview">
                        </div>
                        <div class="img-text">
                            Khuyên dùng ảnh <strong>.png</strong> hoặc <strong>.jpg</strong><br>
                            Tỷ lệ 1:1 (vuông) để hiển thị đẹp nhất.
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="appName">Tên ứng dụng</label>
                    <input type="text" id="appName" class="form-input"
                        placeholder="Nhập tên ứng dụng..." required>
                </div>
                <div class="form-group">
                    <p class="form-group-text">Danh mục</p>
                    <div class="custom-select" id="categorySelect">
                        <div class="select-selected">Công cụ</div>
                        <img class="select-icon" src="../../img/all/arrow-down-s-line.svg" alt="">
                        <ul class="select-options">
                            <li data-value="tool">Công cụ</li>
                            <li data-value="entertainment">Giải trí</li>
                            <li data-value="game">Trò chơi</li>
                        </ul>
                    </div>
                    <input type="hidden" id="category" value="web">
                </div>
                <div class="form-group">
                    <label class="form-label">Ảnh minh hoạ dự án</label>
                    <input type="file" id="previewInput" accept="image/*" hidden>
                    <div class="preview-upload-box" id="previewBox">
                        <span class="preview-text">+ Thêm ảnh minh hoạ</span>
                        <img id="previewImage" src="" alt="">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="description">Mô tả ứng dụng</label>
                    <textarea id="description" class="form-textarea"
                        placeholder="Viết một chút về tính năng và công nghệ bạn sử dụng..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Tệp tin (.apk)</label>
                    <input type="file" id="fileInput" accept=".apk" hidden>
                    <div class="drop-zone" id="dropZone" onclick="">
                        <span class="drop-zone-icon"><img src="../../img/upload/ico-upload.svg" alt=""></span>
                        <p class="drop-zone-text">Kéo thả file vào đây hoặc <span>Duyệt file</span></p>
                        <div id="fileNameDisplay" class="file-info"></div>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Đăng dự án ngay</button>
            </form>
        </div>
    </div>
    <footer></footer>

    <script src="../../share/js/header-search-mobile.js"></script>
    <script src="../../share/js/header.js"></script>
    <script src="../../share/js/footer.js"></script>
    <script>
        const select = document.getElementById("categorySelect");
        const selected = select.querySelector(".select-selected");
        const options = select.querySelectorAll(".select-options li");
        const hiddenInput = document.getElementById("category");
        selected.onclick = () => {
            select.classList.toggle("active");
        };
        options.forEach(option => {
            option.onclick = () => {
                selected.textContent = option.textContent;
                hiddenInput.value = option.dataset.value;
                select.classList.remove("active");
            };
        });
        document.onclick = (e) => {
            if (!select.contains(e.target)) {
                select.classList.remove("active");
            }
        };
    </script>
</body>

</html>
